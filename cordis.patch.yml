# cordis.patch.yml — bundle overlay for dsh-vivy-tone.
#
# Superagent composes one ~43 KB English prompt. This bundle replaces the parts
# this package owns with their Chinese text, through Superagent's own prompt API
# (`PUT /orchestrator/api/prompts`), which is the same API its panel uses. The
# point is readability: the prompt becomes something a person can read and edit
# in Settings -> Prompts -> Full prompt.
#
# It is text only. No identity, relationship, mission, memory, tool permission
# or proactive-timing content — Laputa stays the only persona source
# (docs/architecture.md §17 invariant 4), and nothing here is written outside
# Superagent's own API (§17 invariant 11). This package never edits
# `superagent/`.
#
# Mounted means on: the wave it carries is written once at startup, idempotently.
# To take the translation back out without unmounting,
#   node plugins/dsh-vivy-tone/src/cli.mjs --remove
# and to put it back,
#   node plugins/dsh-vivy-tone/src/cli.mjs --install
# A single part can also be reset from Superagent's own panel. Every save lands
# in the prompt history, so any of these is one revision away from undo.
- insert:
    - id: vivy-tone
      name: dsh-vivy-tone
      config:
        enabled: true
        autoInstall: true
        # force: false        # true = also replace an override this package did not write
        # stateDir: /absolute/path/to/state   # defaults to $DSH_HOME/vivy-tone; a relative value resolves from the cwd
        # timeoutMs: 10000
